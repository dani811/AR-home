name: Branch hygiene

on:
  pull_request:
    types: [closed]
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches from closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          owner="${REPOSITORY%%/*}"
          page=1

          while true; do
            pulls="$({
              curl --fail --silent --show-error \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/pulls?state=closed&per_page=100&page=${page}"
            })"

            count="$(jq 'length' <<<"${pulls}")"
            if [[ "${count}" -eq 0 ]]; then
              break
            fi

            while IFS=$'\t' read -r head_repo head_ref; do
              [[ -z "${head_ref}" ]] && continue
              [[ "${head_repo}" != "${REPOSITORY}" ]] && continue
              [[ "${head_ref}" == "${DEFAULT_BRANCH}" ]] && continue

              open_count="$({
                curl --fail --silent --show-error \
                  --header "Authorization: Bearer ${GH_TOKEN}" \
                  --header "Accept: application/vnd.github+json" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${REPOSITORY}/pulls?state=open&head=${owner}:${head_ref}&per_page=1"
              } | jq 'length')"

              if [[ "${open_count}" -ne 0 ]]; then
                echo "Keeping ${head_ref}: referenced by an open pull request"
                continue
              fi

              status="$({
                curl --silent --show-error \
                  --output /tmp/delete-ref-response \
                  --write-out '%{http_code}' \
                  --request DELETE \
                  --header "Authorization: Bearer ${GH_TOKEN}" \
                  --header "Accept: application/vnd.github+json" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${head_ref}"
              })"

              case "${status}" in
                204) echo "Deleted ${head_ref}" ;;
                404) echo "Already absent: ${head_ref}" ;;
                422) echo "Protected or not deletable: ${head_ref}" ;;
                *)
                  cat /tmp/delete-ref-response >&2 || true
                  echo "Failed deleting ${head_ref}: HTTP ${status}" >&2
                  exit 1
                  ;;
              esac
            done < <(jq -r '.[] | [.head.repo.full_name // "", .head.ref // ""] | @tsv' <<<"${pulls}")

            page=$((page + 1))
          done
