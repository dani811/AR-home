name: Mobile Android CI

on:
  pull_request:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-android-ci.yml'
  push:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-android-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Test, build and lint Android localizer
        working-directory: mobile-android
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ar-home-localizer-debug
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
